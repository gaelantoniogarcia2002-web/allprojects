schema: spec-driven

context: |
  Project: allprojects — "Base de Datos Visual de Proyectos"
  Stack: not yet chosen (greenfield, no code/package manager present)
  Architecture: to be decided (candidate: modular structure for Gentleman AI Stack subagents)
  Persistence: to be decided (candidate: Local SQLite / JSON / Supabase)
  Domain entities: Proyecto (main), Inspiracion (sub-entity)
  Source spec: /home/gael/allprojects/spec.md

strict_tdd: true

testing:
  status: detected
  reason: "Vitest test runner scaffolded in PR 1 (base-datos-visual-proyectos); 50 tests across component/schema/repository/seed layers passing as of PR 4."
  strict_tdd_source: "agent marker (CLAUDE.md: 'Strict TDD Mode: enabled')"
  test_layers:
    unit: available
    integration: available
    e2e: unavailable
  coverage:
    available: false
    command: ""
  quality_tools:
    linter: unavailable
    type_checker: available
    formatter: unavailable
  next_step: "None — test runner and layers resolved for the data layer. Re-evaluate e2e/linter/formatter when Fase 2 (UI) work begins."

rules:
  proposal:
    - Include a stack-selection decision (frontend framework, persistence layer) since none exists yet
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Cover the Proyecto and Inspiracion entities defined in /home/gael/allprojects/spec.md
  design:
    - Document the chosen persistence layer (SQLite / JSON / Supabase) with rationale
    - Document the visual gallery rendering approach (masonry/grid, proportional sizing, progress fill)
    - Include sequence diagrams for complex flows
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - First task group MUST bootstrap the chosen stack and test runner before feature work
  apply:
    guidelines:
      - Follow existing code patterns once established
      - Once a test runner exists, follow strict TDD (RED-GREEN-REFACTOR) per project marker
    tdd: true
    test_command: "npm test"
  verify:
    test_command: "npm test"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
